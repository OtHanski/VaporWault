name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Windows GUI job vendors the same pinned SDL2 build release.yml ships —
  # TASK-082: keep these two values in sync with release.yml's when bumping
  # either one (a mismatch would mean CI validates a different SDL2 build
  # than what actually ships).
  SDL2_VERSION: "2.32.10"
  SDL2_ZIP_SHA256: "af347939395a58b365846aaea27391e69f9ec9d4dd650d6ac40802159b418a6e"

# ── Linux matrix: GCC + Clang × Debug + Release ─────────────────────────────
jobs:
  build-linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC:  ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3 git
          # mbedTLS and Argon2 are downloaded at configure time via FetchContent.
          # Do not install libmbedtls-dev — the project config header would be ignored.
          # GUI targets are disabled (VW_BUILD_GUI=OFF) so SDL2 is not required here.

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DVW_BUILD_SERVER=ON  \
            -DVW_BUILD_CLIENT=ON  \
            -DVW_BUILD_GUI=OFF    \
            -DVW_BUILD_TOOLS=ON   \
            -DVW_BUILD_TESTS=ON   \
            -DVW_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        working-directory: build
        env:
          CTEST_TEST_TIMEOUT: "30"
        run: ctest --output-on-failure --no-tests=error -R unit --timeout 30

      # Fuzz regression: build with libFuzzer+ASan+UBSan, replay the seed corpus.
      # Only runs on the Clang/Release cell — libFuzzer is a Clang/LLVM component.
      # The regression script replays each corpus seed once (-runs=1) to catch
      # regressions without spending time on corpus expansion.
      - name: Fuzz regression (Clang / Release only)
        if: matrix.compiler == 'clang' && matrix.build_type == 'Release'
        run: |
          cmake -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Fuzz \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DVW_BUILD_SERVER=ON \
            -DVW_BUILD_CLIENT=OFF \
            -DVW_BUILD_GUI=OFF \
            -DVW_BUILD_TOOLS=OFF \
            -DVW_BUILD_TESTS=ON

          cmake --build build-fuzz --parallel \
            --target fuzz_proto_recv \
                    fuzz_path_validate \
                    fuzz_oplog_replay \
                    fuzz_cluster_hello \
                    fuzz_admin_dispatch

          if [ -f tests/fuzz/run_regression.sh ]; then
            bash tests/fuzz/run_regression.sh build-fuzz
          else
            echo "No fuzz corpus yet — skipping regression replay"
          fi

# ── Windows matrix: MSVC × Debug + Release ───────────────────────────────────
  build-windows:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # Set up the MSVC native tools environment so CMake can find cl.exe.
      # ilammy/msvc-dev-cmd uses vswhere to locate any installed VS version,
      # so this works with VS 2022 and VS 2026 alike.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DVW_BUILD_SERVER=ON `
            -DVW_BUILD_CLIENT=ON `
            -DVW_BUILD_GUI=OFF   `
            -DVW_BUILD_TOOLS=ON  `
            -DVW_BUILD_TESTS=ON  `
            -DVW_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Disable Windows Error Reporting dialogs
        run: reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f

      - name: Unit tests
        working-directory: build
        env:
          CTEST_TEST_TIMEOUT: "30"
        run: ctest --output-on-failure --no-tests=error -R unit --timeout 30

# ── GUI build coverage (TASK-082) ────────────────────────────────────────────
#
# The main matrix above always builds with VW_BUILD_GUI=OFF (SDL2 isn't
# vendored there), so a GUI build/link regression previously surfaced for the
# first time when cutting a real release, not on a regular PR (this is
# exactly what happened before v0.1.0 shipped — see TASK-081's history). These
# two jobs mirror release.yml's GUI build setup (apt SDL2 on Linux, vendored
# VC devel zip on Windows) as a required check on every push/PR instead.
  build-linux-gui:
    name: Linux / gcc / Release / GUI=ON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3 git libsdl2-dev

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_BUILD_SERVER=ON  \
            -DVW_BUILD_CLIENT=ON  \
            -DVW_BUILD_GUI=ON     \
            -DVW_BUILD_TOOLS=ON   \
            -DVW_BUILD_TESTS=OFF  \
            -DVW_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

  build-windows-gui:
    name: Windows / MSVC / Release / GUI=ON
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Vendor SDL2 (VC devel package)
        shell: pwsh
        run: |
          $ver = $env:SDL2_VERSION
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$ver/SDL2-devel-$ver-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile sdl2.zip

          $actualHash = (Get-FileHash sdl2.zip -Algorithm SHA256).Hash
          if ($actualHash -ne $env:SDL2_ZIP_SHA256) {
            Write-Error "SDL2 zip checksum mismatch: expected $env:SDL2_ZIP_SHA256, got $actualHash"
            exit 1
          }

          Expand-Archive -Path sdl2.zip -DestinationPath sdl2-extracted
          Move-Item "sdl2-extracted/SDL2-$ver" "third_party/SDL2"

      - name: Configure
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DVW_BUILD_SERVER=ON  `
            -DVW_BUILD_CLIENT=ON  `
            -DVW_BUILD_GUI=ON     `
            -DVW_BUILD_TOOLS=ON   `
            -DVW_BUILD_TESTS=OFF  `
            -DVW_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

# ── Integration: real server + Python pytest suite ────────────────────────────
  integration:
    name: Integration / Linux / gcc / Release
    runs-on: ubuntu-latest
    needs: build-linux   # run after matrix so we know it at least compiles

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3 python3-pip openssl

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_BUILD_SERVER=ON  \
            -DVW_BUILD_CLIENT=ON  \
            -DVW_BUILD_GUI=OFF    \
            -DVW_BUILD_TOOLS=ON   \
            -DVW_BUILD_TESTS=ON   \
            -DVW_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Install Python test dependencies
        run: pip install pytest pytest-timeout

      - name: Generate test TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 \
            -keyout tests/integration/test.key \
            -out    tests/integration/test.crt \
            -days 1 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"

      - name: Run pytest integration tests
        run: |
          pytest tests/integration/ \
            -v -m "not cluster" \
            --timeout=60 \
            --server-bin  build/bin/vapourwaultd \
            --admin-cli   build/bin/vapourwault-server-cli \
            --test-cert   tests/integration/test.crt \
            --test-key    tests/integration/test.key

      # Cluster tests stand up two real vapourwaultd instances and pair them
      # (node-add + register-self, then poll for oplog replication), so they
      # run noticeably slower than the rest of the suite (TASK-086) — kept as
      # a separate step with its own generous timeout rather than folded into
      # the main run above.
      - name: Run pytest cluster integration tests
        run: |
          pytest tests/integration/test_cluster.py \
            -v -m cluster \
            --timeout=90 \
            --server-bin  build/bin/vapourwaultd \
            --admin-cli   build/bin/vapourwault-server-cli \
            --test-cert   tests/integration/test.crt \
            --test-key    tests/integration/test.key

      # Fallback: run the older TAP-based integration suite if pytest has
      # no collected tests yet (TASK-055 adds them; this guards the window
      # between TASK-058 merging and TASK-055 landing).
      - name: Run legacy TAP integration suite
        if: always()
        working-directory: build
        run: |
          ctest --output-on-failure --no-tests=error -L integration --timeout 180
