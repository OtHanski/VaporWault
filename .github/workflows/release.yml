name: Release

# Push a version tag (e.g. `v0.1.0`) to build binaries for Linux and Windows and
# publish them as a GitHub Release. Can also be run manually via workflow_dispatch
# to dry-run the build/package steps (no release is published for manual runs) —
# see docs/RELEASE.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag name to use for build artifacts (dry run only — no GitHub Release is published for manual runs)'
        required: true
        default: v0.0.0-dryrun

# Least-privilege default: only the publish job (which calls `gh release create`)
# elevates to contents:write, scoped at the job level below.
permissions:
  contents: read

env:
  # Pin to a specific SDL2 release for Windows vendoring. VENDOR_SETUP.md only
  # documents a *minimum* supported version (2.26.0) for local/manual vendoring —
  # keep SDL2_VERSION in sync with that minimum when bumping either one.
  SDL2_VERSION: "2.32.10"
  SDL2_ZIP_SHA256: "af347939395a58b365846aaea27391e69f9ec9d4dd650d6ac40802159b418a6e"
  # WiX Toolset v3 fallback (TASK-151/153) — only fetched if the primary
  # `choco install` path fails. Pinned and checksum-verified for the same
  # reason SDL2 is above: don't silently link/build against a tampered or
  # unexpectedly-changed third-party binary fetched mid-CI-run.
  WIX_VERSION: "3.11.2"
  WIX_ZIP_SHA256: "ac2fff0541f87756b530c93ca3a45ff2dfb1ebe392c269901de0c19074bec5d0"
  # Computed once, shared by every job — see the "TAG comes from workflow-level
  # env" comments below for why this is never interpolated directly into a
  # `run:` block.
  TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  REPO: ${{ github.repository }}

jobs:
  build-linux:
    name: Build / Linux / x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3 git libsdl2-dev dpkg-dev rpm

      # PKG_VERSION strips the leading "v" from TAG (workflow-level env,
      # never interpolated directly into a shell script — same discipline
      # as every other TAG use in this workflow, TASK-081) since .deb/.rpm
      # version fields don't accept an arbitrary leading letter.
      - name: Compute package version
        run: echo "PKG_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_BUILD_SERVER=ON  \
            -DVW_BUILD_CLIENT=ON  \
            -DVW_BUILD_GUI=ON     \
            -DVW_BUILD_TOOLS=ON   \
            -DVW_BUILD_TESTS=OFF  \
            -DVW_WERROR=ON        \
            -DVW_VERSION="$PKG_VERSION"

      - name: Build
        run: cmake --build build --parallel

      # TASK-082: a binary that links but crashes on startup (missing shared
      # lib, bad rpath, etc.) would otherwise still ship undetected. The two
      # GUI binaries (vapourwault-gui, vapourwault-server-gui) are excluded —
      # they call SDL_Init(SDL_INIT_VIDEO) unconditionally with no arg
      # parsing at all (no --help to smoke-test with), so exercising them
      # would need a virtual display (Xvfb) and a working software GL
      # renderer in CI, which is its own project — not attempted here.
      - name: Smoke-test built binaries
        run: |
          set -e
          for bin in vapourwaultd vapourwault-daemon vapourwault-cli vapourwault-server-cli; do
            echo "::group::$bin --help"
            build/bin/"$bin" --help
            echo "::endgroup::"
          done

      # TAG comes from workflow-level `env:` (never interpolated directly from a
      # `${{ }}` expression into a shell script — avoids template/script
      # injection via an attacker-controlled ref/tag name).
      - name: Stage release archive
        run: |
          STAGE="vaporwault-${TAG}-linux-x86_64"
          mkdir -p "$STAGE"
          cp build/bin/* "$STAGE"/
          cp README.md "$STAGE"/
          tar czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      # TASK-145/149/150: proper .deb/.rpm packages alongside the tarball
      # above (kept, not replaced — still useful for scripted/air-gapped
      # deployments). One package per CPack component (server/client) per
      # format, verified locally (TASK-149/150) via real install/upgrade/
      # remove/purge testing in disposable containers.
      # Packages are built inside build/ (that's where the CPackConfig.cmake
      # generated at configure time lives) then copied up to the workspace
      # root so the upload-artifact path list below only ever references
      # flat, top-level filenames — same convention the tarball above
      # already uses, and avoids relying on how upload-artifact flattens
      # (or doesn't) nested directory structure across mixed path patterns.
      - name: Build installer packages (.deb, .rpm)
        run: |
          (cd build && cpack -G DEB && cpack -G RPM)
          cp build/*.deb build/*.rpm .
          sha256sum *.deb *.rpm > linux-packages.sha256
          cat linux-packages.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release
          path: |
            vaporwault-${{ env.TAG }}-linux-x86_64.tar.gz
            vaporwault-${{ env.TAG }}-linux-x86_64.tar.gz.sha256
            *.deb
            *.rpm
            linux-packages.sha256
          if-no-files-found: error

  build-windows:
    name: Build / Windows / x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # Set up the MSVC native tools environment so CMake can find cl.exe.
      # ilammy/msvc-dev-cmd uses vswhere to locate any installed VS version,
      # so this works with VS 2022 and VS 2026 alike (matches ci.yml).
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # PKG_VERSION strips the leading "v" from TAG (workflow-level env,
      # never interpolated directly into a shell script — TASK-081's
      # discipline) since MSI version fields don't accept a leading letter.
      - name: Compute package version
        shell: pwsh
        run: "'PKG_VERSION=' + $env:TAG.TrimStart('v') | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8"

      # TASK-145/147/148: WiX Toolset v3 (candle.exe/light.exe) is required
      # by CPack's WIX generator; it does not ship on windows-latest.
      # Try the package manager first (simplest); if it fails the same way
      # this session's sandboxed dev environment did (a Chocolatey
      # lock-file permission error, TASK-151's filing note — possibly
      # sandbox-specific, not necessarily reproducible on a real hosted
      # runner) fall back to fetching the same NuGet package this
      # session's manual verification used.
      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          choco install wixtoolset -y --no-progress
          $chocoOk = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($chocoOk -and (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            Write-Host "WiX Toolset installed via Chocolatey."
          } else {
            Write-Host "Chocolatey install unavailable/failed; fetching WiX $env:WIX_VERSION NuGet package directly."
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/wix/$env:WIX_VERSION" -OutFile wix.zip

            $actualHash = (Get-FileHash wix.zip -Algorithm SHA256).Hash
            if ($actualHash -ne $env:WIX_ZIP_SHA256) {
              Write-Error "WiX zip checksum mismatch: expected $env:WIX_ZIP_SHA256, got $actualHash"
              exit 1
            }

            Expand-Archive -Path wix.zip -DestinationPath wix-tools
            Add-Content -Path $env:GITHUB_PATH -Value "$(Resolve-Path wix-tools\tools)"
          }

      - name: Vendor SDL2 (VC devel package)
        shell: pwsh
        run: |
          $ver = $env:SDL2_VERSION
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$ver/SDL2-devel-$ver-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile sdl2.zip

          $actualHash = (Get-FileHash sdl2.zip -Algorithm SHA256).Hash
          if ($actualHash -ne $env:SDL2_ZIP_SHA256) {
            Write-Error "SDL2 zip checksum mismatch: expected $env:SDL2_ZIP_SHA256, got $actualHash"
            exit 1
          }

          Expand-Archive -Path sdl2.zip -DestinationPath sdl2-extracted
          Move-Item "sdl2-extracted/SDL2-$ver" "third_party/SDL2"

      - name: Configure
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DVW_BUILD_SERVER=ON  `
            -DVW_BUILD_CLIENT=ON  `
            -DVW_BUILD_GUI=ON     `
            -DVW_BUILD_TOOLS=ON   `
            -DVW_BUILD_TESTS=OFF  `
            -DVW_WERROR=ON        `
            -DVW_VERSION="$env:PKG_VERSION"

      - name: Build
        run: cmake --build build --parallel

      # TASK-082: same rationale as the Linux job's smoke-test step. The two
      # GUI binaries are excluded there too (no --help, requires a real
      # display); the four smoke-tested binaries here are pure C and don't
      # link SDL2, so this doesn't need SDL2.dll on PATH.
      - name: Smoke-test built binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($bin in "vapourwaultd", "vapourwault-daemon", "vapourwault-cli", "vapourwault-server-cli") {
            Write-Host "::group::$bin --help"
            & "build/bin/$bin.exe" --help
            if ($LASTEXITCODE -ne 0) {
              Write-Error "$bin --help exited $LASTEXITCODE"
              exit 1
            }
            Write-Host "::endgroup::"
          }

      # TAG comes from workflow-level `env:` (see note in the Linux job's staging step).
      - name: Stage release archive
        shell: pwsh
        run: |
          $stage = "vaporwault-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/bin/*.exe $stage/
          Copy-Item third_party/SDL2/lib/x64/SDL2.dll $stage/
          Copy-Item README.md $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$stage.zip.sha256" -Value "$hash  $stage.zip" -NoNewline -Encoding ascii

      # TASK-145/147/148: one MSI per CPack component (server/client), not
      # one combined MSI — CPack's WIX generator does not natively split
      # components into separate MSIs the way DEB/RPM do, so `cpack` is
      # invoked once per component with different -D overrides (verified
      # empirically this session — see TASK-147/148's implementation
      # notes for why). CPACK_WIX_UPGRADE_GUID values are permanently
      # fixed per product; never regenerate them.
      # Same "stage flat at workspace root" reasoning as the Linux job's
      # package step above.
      #
      # CPACK_PACKAGE_FILE_NAME is set explicitly and MUST differ between
      # the two invocations: without it, both `cpack -G WIX` calls produce
      # the exact same default output filename (unlike DEB/RPM, whose
      # default naming already varies by component), so the second
      # invocation silently overwrites the first's .msi on disk. Caught by
      # actually running this exact two-invocation sequence end-to-end in
      # this session (TASK-151) — the first attempt produced only one
      # surviving file where two were expected.
      - name: Build installer packages (.msi)
        shell: pwsh
        run: |
          Push-Location build
          cpack -G WIX `
            -D CPACK_COMPONENTS_ALL=server `
            -D CPACK_WIX_UPGRADE_GUID=5ADE0205-57FF-4286-849A-C112AF550215 `
            -D CPACK_WIX_PATCH_FILE="$(Resolve-Path ../packaging/windows/wix/server-patch.xml)" `
            -D CPACK_WIX_EXTENSIONS=WixFirewallExtension `
            -D CPACK_PACKAGE_FILE_NAME="vaporwault-server-$env:PKG_VERSION-win64"
          cpack -G WIX `
            -D CPACK_COMPONENTS_ALL=client `
            -D CPACK_WIX_UPGRADE_GUID=88FDD57B-FD91-4214-B6F5-B1343F75ABBB `
            -D CPACK_WIX_INSTALL_SCOPE=perUser `
            -D CPACK_WIX_EXTRA_SOURCES="$(Resolve-Path ../packaging/windows/wix/client-extra.wxs)" `
            -D CPACK_WIX_PATCH_FILE="$(Resolve-Path ../packaging/windows/wix/client-patch.xml)" `
            -D CPACK_WIX_CANDLE_EXTRA_FLAGS="-dVW_WIX_DIR=$(Resolve-Path ../packaging/windows/wix)" `
            -D CPACK_PACKAGE_FILE_NAME="vaporwault-client-$env:PKG_VERSION-win64"
          Pop-Location
          Copy-Item build/*.msi .
          Get-ChildItem *.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content -Path windows-packages.sha256 -Encoding ascii
          }

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: |
            vaporwault-${{ env.TAG }}-windows-x86_64.zip
            vaporwault-${{ env.TAG }}-windows-x86_64.zip.sha256
            *.msi
            windows-packages.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    # Manual workflow_dispatch runs are build-only dry runs — never publish a
    # real release from one.
    if: github.event_name == 'push'
    permissions:
      contents: write   # only this job needs write access, for gh release create/upload
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      # Re-running this workflow for a tag that was already published (e.g. after
      # a transient failure) uploads/overwrites assets instead of hard-failing
      # with "release already exists". TAG/REPO come from workflow-level `env:`
      # (never interpolated directly from a `${{ }}` expression into a shell
      # script) — same rationale as the build jobs' staging steps.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/linux-release/* \
              dist/windows-release/* \
              --repo "$REPO" \
              --clobber
          else
            gh release create "$TAG" \
              dist/linux-release/* \
              dist/windows-release/* \
              --repo "$REPO" \
              --title "VaporWault $TAG" \
              --generate-notes
          fi
