plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// TASK-00289: real release signing, sourced entirely from environment
// variables so the actual keystore file/passwords never touch this file
// or git history. release.yml's build-android job decodes its
// base64-encoded keystore secret to a runner-temp file and sets these
// four env vars for the assembleRelease step only. A local build without
// them set (no contributor has a copy of the real keystore) falls back to
// signingConfigs.debug below, matching TASK-239's original reasoning that
// an unsigned release APK can't install at all.
def releaseKeystorePath = System.getenv("ANDROID_RELEASE_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystorePath != null && file(releaseKeystorePath).exists()

android {
    namespace "com.vaporwault.client"
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.vaporwault.client"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // 32-bit x86 is obsolete for new Play Store targeting; arm64-v8a is
            // mandatory, armeabi-v7a covers older real devices, x86_64 covers
            // emulators (TASK-224/225).
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // TASK-00289: this project's own dedicated release keystore
            // when available (CI, or a local build with the four env vars
            // above set by hand), the standard Gradle debug key otherwise.
            // See docs/RELEASE.md's Android APK section for the real
            // certificate's fingerprint and how the keystore is stored.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Minimum viable AndroidX set for a Views-based app on current API
    // levels (ARCHITECTURE.md's Approved External Dependencies addendum,
    // TASK-224) — no Compose, no androidx.security-crypto, no WorkManager/Room.
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Instrumented tests only (TASK-235). uiautomator (not just Espresso)
    // is required because several flows this app drives cross into
    // system UI outside the app's own process — the SAF document
    // picker/DocumentsUI in particular — which Espresso's in-app view
    // matchers cannot reach at all.
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
