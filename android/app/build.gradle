plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace "com.vaporwault.client"
    compileSdk 34
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.vaporwault.client"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            // 32-bit x86 is obsolete for new Play Store targeting; arm64-v8a is
            // mandatory, armeabi-v7a covers older real devices, x86_64 covers
            // emulators (TASK-224/225).
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Minimum viable AndroidX set for a Views-based app on current API
    // levels (ARCHITECTURE.md's Approved External Dependencies addendum,
    // TASK-224) — no Compose, no androidx.security-crypto, no WorkManager/Room.
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
}
