<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaporWault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="login-view">
      <form id="login-form">
        <h1 id="login-heading">VaporWault</h1>
        <input id="login-username" type="text" placeholder="Username" autocomplete="username" required>
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
        <div id="otp-field" hidden>
          <input id="login-otp" type="text" placeholder="2FA code" autocomplete="one-time-code">
        </div>
        <label id="remember-me-field" class="checkbox-field">
          <input id="login-remember" type="checkbox">
          Remember me on this device
        </label>
        <button type="submit">Log in</button>
        <button type="button" id="login-cancel-btn" hidden>Cancel</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="link-view" hidden>
      <form id="link-access-form">
        <h1>VaporWault</h1>
        <p id="link-access-status">Opening shared link...</p>
        <div id="link-access-password-field" hidden>
          <input id="link-access-password" type="password" placeholder="Password" autocomplete="off">
        </div>
        <button type="submit" id="link-access-submit-btn" hidden>Open</button>
        <p id="link-access-error" class="error" hidden></p>
      </form>
    </section>

    <section id="browser-view" hidden>
      <header>
        <div id="account-switcher"></div>
        <span id="current-path" title="Click to go up one level">/</span>
        <button id="settings-btn">Settings</button>
        <button id="logout-btn">Log out</button>
      </header>
      <div id="toolbar">
        <button id="mkdir-btn">New folder</button>
        <button id="upload-btn">Upload</button>
        <input id="upload-input" type="file" multiple hidden>
        <button id="vault-create-btn">Make this folder a vault</button>
        <input id="search-input" type="text" placeholder="Search files...">
        <button id="search-clear-btn" hidden>Clear search</button>
      </div>
      <p id="search-status" class="error" hidden></p>
      <div id="vault-banner" class="vault-banner" hidden>
        <span id="vault-banner-text"></span>
        <button id="vault-unlock-btn">Unlock</button>
        <button id="vault-lock-btn" hidden>Lock</button>
      </div>
      <table id="file-table">
        <thead>
          <tr><th>Name</th><th>Size</th><th>Modified</th><th></th></tr>
        </thead>
        <tbody id="file-table-body"></tbody>
      </table>
      <p id="browser-error" class="error" hidden></p>
      <ul id="transfer-list"></ul>
    </section>

    <section id="history-view" hidden>
      <header>
        <span id="history-file-label"></span>
        <button id="history-back-btn">Back</button>
      </header>
      <table id="version-table">
        <thead>
          <tr><th>Version</th><th>Size</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="version-table-body"></tbody>
      </table>
      <p id="history-error" class="error" hidden></p>
    </section>

    <section id="share-view" hidden>
      <header>
        <span id="share-file-label"></span>
        <button id="share-back-btn">Back</button>
      </header>

      <h3>Grant access</h3>
      <div id="share-grant-form" class="inline-form">
        <input id="share-username" type="text" placeholder="Username">
        <select id="share-permission">
          <option value="1">View</option>
          <option value="2">Edit</option>
        </select>
        <button id="share-grant-btn">Grant</button>
      </div>
      <table id="share-table">
        <thead>
          <tr><th>User</th><th>Permission</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="share-table-body"></tbody>
      </table>

      <h3>Public links</h3>
      <div class="inline-form">
        <label><input id="link-expiry-check" type="checkbox"> Expires in
          <input id="link-expiry-days" type="number" min="1" value="30" style="width:4em"> days</label>
        <label><input id="link-password-check" type="checkbox"> Password
          <input id="link-password" type="password" placeholder="Password" disabled></label>
        <button id="link-create-btn">Create public link</button>
      </div>
      <div id="link-new-token" class="inline-form" hidden>
        <input id="link-new-token-input" type="text" readonly>
        <button id="link-copy-btn">Copy</button>
        <button id="link-dismiss-btn">Done</button>
      </div>
      <table id="link-table">
        <thead>
          <tr><th>Link</th><th>Permission</th><th>Password</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="link-table-body"></tbody>
      </table>

      <p id="share-error" class="error" hidden></p>
    </section>

    <section id="settings-view" hidden>
      <header>
        <span>Settings</span>
        <button id="settings-back-btn">Back</button>
      </header>

      <h3>Email notifications</h3>
      <p class="note">Sent to your account's on-file email address. Off by default.</p>
      <div id="notify-prefs-list"></div>
      <p id="settings-error" class="error" hidden></p>
    </section>
  </div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
